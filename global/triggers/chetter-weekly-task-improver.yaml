# yaml-language-server: $schema=../../../chetter/schemas/trigger.schema.json
# Trigger: weekly Chetter task improver
#
# Finds one repeated, definition-actionable failure pattern and proposes one
# small reviewed change to the responsible trigger or agent.
#
# To create: chetter_create_trigger with these fields.
# To change later: chetter_update_trigger with changed fields.

name: chetter-weekly-task-improver
enabled: true
cron_expr: "0 2 * * 0"
git_url: https://github.com/flatout-works/chetter-config
git_ref: main
agent_image: ghcr.io/flatout-works/chetter-agent:golang
harness: opencode
agent: task-improver
provider_id: synthetic
model_id: hf:moonshotai/Kimi-K3
timeout_sec: 2400
skills:
  - chetter
prompt: |-
  Review mode: repeated failure correction.

  GITHUB_REPO=flatout-works/chetter-config

  Find and correct one repeated task failure caused by a trigger prompt or its
  referenced agent definition.

  ## Bounded procedure

  1. Call `chetter_list_tasks` once with `status="error"` and `limit=12`.
     From the results, discard every task whose `trigger_name` does not have a
     corresponding definition file in this repository (look in
     `global/triggers/`, `groups/*/triggers/`, `repos/*/triggers/`). Use one
     `glob` call to confirm which trigger files exist here. If fewer than 2
     tasks remain, exit cleanly.
  2. From the remaining tasks, identify one error pattern affecting at least
     two tasks from the same trigger. Ignore lease expiry, runner availability,
     provider outages, rate limits, and harness crashes unless the trigger
     selected a known-incompatible model/harness combination.
  3. If no repeated definition-actionable pattern exists, report the candidate
     count and exit without changes.
  4. Inspect at most three representative task IDs. Request only the progress
     or events needed to confirm the suspected root cause. Never read full
     task exports during discovery; use those only to verify a confirmed
     hypothesis.
  5. Read only the selected trigger file and its referenced agent file. Do not
     enumerate or read unrelated definitions, search for schema files, or
     consult the model catalog unless a model/harness incompatibility is the
     confirmed hypothesis.
  6. Make one focused correction in at most two files. Do not add new agents,
     skills, triggers, or templates during this run.
  7. Run `git diff --check` and verify changed YAML or frontmatter against the
     repository schemas.

  If the evidence supports the correction, create a branch, commit and push the
  change, then open one pull request against `main` using `chetter_create_pr`.
  Call `chetter_create_pr` with
  `task_id=$CHETTER_TASK_ID`, `repo="$GITHUB_REPO"`, the pushed branch as
  `head`, and `base="main"`. Do not use `gh pr create` and do not manually add
  the Chetter footer. Include the inspected task IDs and repeated root cause in
  the PR body.

  Do not directly mutate production definitions in the database. Durable
  changes must go through a Git pull request.
