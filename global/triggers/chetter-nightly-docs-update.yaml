# yaml-language-server: $schema=../../../chetter/schemas/trigger.schema.json
# Trigger: nightly documentation update from recent git changes
#
# Customize before enabling:
#   git_url      - your repository URL
#   git_ref      - branch to work from (usually main)
#   agent_image  - runner image (get from your Chetter admin or build your own)
#   agent        - optional: custom docs agent if you have one
#   timeout_sec  - adjust based on repo size and number of docs
#   prompt       - adapt the doc paths and conventions to your project
#
# To create: chetter_create_trigger with these fields.
# To change later: chetter_update_trigger with changed fields.

name: chetter-nightly-docs-update
enabled: true
cron_expr: "30 4 * * *"
git_url: https://github.com/flatout-works/chetter
git_ref: main
agent_image: ghcr.io/flatout-works/chetter-agent:golang
harness: claude-code
agent: docs-maintainer
provider_id: synthetic
model_id: hf:zai-org/GLM-5.3-Flash
timeout_sec: 7200
# Resumable (gVisor): a stuck or failed attempt keeps its container, so the
# session can be resumed with the workspace intact within ttl_hours.
session_mode: resumable
ttl_hours: 24
prompt: |-
  Review recent repository changes and update documentation so it matches the
  implementation.

  GITHUB_REPO=flatout-works/chetter

  Start by inspecting recent history:

      git log --since="24 hours ago" --no-merges --pretty=format:"%h %ad %s" --date=iso

  Scope: only the commits in this window on the checked-out branch. Do not
  audit open PRs, closed PRs, issues, or older history; do not re-review work
  from previous nightly runs. If the window has no non-merge commits, report
  that and exit without further investigation.

  Bounded review (complete within 15 minutes):
  - Read only doc files touched by the reviewed commits, plus one targeted
    grep sweep across `docs/` and `README.md` for stale claims about those
    changes. Do not read every doc file end to end.
  - Edit at most 4 doc files per run. Prefer the single most accurate minimal
    fix per gap; if a gap is cosmetic, skip it.

  Update docs that are outdated, incomplete, or inaccurate. Keep the existing
  structure, tone, and formatting. Make the smallest accurate changes. Do not
  describe planned work as shipped behavior.

   If documentation changes are made, create a branch named
   `docs/nightly-update-YYYY-MM-DD-HHMM` using UTC time, commit with message
   `docs: update documentation from recent changes`, push, and open a pull
   request against `main` using the `chetter_create_pr` MCP tool.

    Call `chetter_create_pr` with `task_id=$CHETTER_TASK_ID`, `repo="$GITHUB_REPO"`, `head=<branch-name>`, and `base="main"`. Do not use `gh pr create` and do not manually add the Chetter footer; the tool adds the canonical footer and records audit/artifact metadata.

  If no documentation changes are needed, report that and exit without a PR.
  Do not push directly to `main`.

  ## Stopping rules

  This task has exactly two terminal states: PR created, or no documentation
  changes needed. When you reach one:
  1. Print the final summary (PR URL or exit reason) as your last message.
  2. Stop immediately. Make no further tool calls. Do not re-verify completed
     work: no repeated `git status`, no re-checking the PR, no re-grepping
     docs already swept.
  3. Call `chetter_create_pr` at most once. A returned PR URL is proof the PR
     exists.
  4. If a continuation prompt arrives after a terminal state, reply with a
     one-line final status and stop. Do not reopen the investigation or
     review open PRs.
