# yaml-language-server: $schema=../../../chetter/schemas/trigger.schema.json
name: chetter-nightly-docs-update
enabled: true
cron_expr: "30 4 * * *"
git_url: https://github.com/flatout-works/chetter
git_ref: main
agent_image: ghcr.io/flatout-works/chetter-agent:golang
harness: claude-code
agent: docs-maintainer
provider_id: synthetic
model_id: syn:large:text
timeout_sec: 7200
session_mode: resumable
ttl_hours: 24
prompt: |-
  Review recent changes in flatout-works/chetter and make the smallest factual
  documentation corrections. GITHUB_REPO=flatout-works/chetter

  Inspect non-merge history from the last 24 hours on the checked-out main:
      git log --since="24 hours ago" --no-merges --pretty=format:"%h %ad %s" --date=iso
  No commits means report no changes and stop. Only document shipped behavior.
  Check previous nightly docs PR titles/file lists once to avoid duplicating
  an existing correction; do not conduct an issue/PR audit or merge old PRs.

  Complete the review within 15 minutes. Read affected source/doc regions and
  one targeted search across README.md/docs for stale claims. Do not read the
  entire documentation tree. Edit at most four prose documentation files.
  Eligible paths: README*.md, CHANGELOG.md, docs/**/*.md. Do not change code,
  schemas, config, workflows, AGENTS.md, scripts, lockfiles or binary assets.

  If corrections are needed, create docs/nightly-update-YYYY-MM-DD-HHMM (UTC),
  run git diff --check and the repository-required checks relevant to docs,
  commit, push, and create one PR against main using chetter_create_pr with
  task_id=$CHETTER_TASK_ID, repo=$GITHUB_REPO, head=<branch>, base="main".
  Do not use gh pr create, manually add the footer, or push directly to main.

  You are explicitly authorized to self-merge ONLY this activation's own
  verified docs-only PR. Follow docs-maintainer's self-merge safety checklist:
  inspect the complete PR diff/file list, verify head/base, local checks and
  current CI/review/mergeability. Do not bypass any GitHub protection. Wait
  at most 60 seconds for checks; pending/failed/unknown checks, change requests,
  conflicts or unexpected changes mean leave it open with a clear reason.
  If safe, call runner-bridge chetter_merge_pr with repo=$GITHUB_REPO,
  pr_number=<your created PR number>, merge_method="MERGE" (no task_id arg).
  If refused, leave it open; do not fall back to gh merge or direct pushes.

  Create at most one PR and attempt merge at most once. No changes, PR merged,
  or PR left open with a reason are terminal: print the summary/URL and stop.
  No repeated scans or post-settlement verification. If a continuation arrives
  afterward, reply with a one-line final status and stop.
