# yaml-language-server: $schema=../../../../../chetter/schemas/trigger.schema.json
# Trigger: Niffler nightly website update
#
# Reviews the last 24 hours of changes and updates the static website
# (website/index.html, components.html, i18n copy) so it reflects the
# current state of the product.

name: niffler-nightly-website-update
enabled: true
cron_expr: "10 4 * * *"
git_url: https://github.com/gokr/niffler
git_ref: main
agent_image: ghcr.io/flatout-works/chetter-agent:nim
harness: claude-code
agent: docs-maintainer
provider_id: synthetic
model_id: hf:zai-org/GLM-5.3-Flash
timeout_sec: 7200
# Resumable (gVisor): a stuck or failed attempt keeps its container, so the
# session can be resumed with the workspace intact within ttl_hours.
session_mode: resumable
ttl_hours: 24
prompt: |-
  Review all changes made to the repository in the last 24 hours and update
  the static website so it accurately reflects the current state of the
  product.

  GITHUB_REPO=gokr/niffler

  ## Step 1: Understand what changed
  Run:
  ```bash
  git log --since="24 hours ago" --pretty=format:"%h %s" --all
  ```

  ## Step 2: Read current materials
  Read these files to understand the current messaging:
  - `website/index.html` — the public website
  - `website/components.html` — the components status page
  - `website/styles.css`, `website/app.js` — styles and behavior
  - `website/i18n.js` — locale strings (keep all locales in sync)

  Also read source-of-truth docs: `README.md`, `AGENTS.md`, `CHANGELOG.md`,
  `docs/MANUAL.md`, and `manifest.yaml`.

  ## Step 3: Update the website
  Update the website pages to accurately describe current product
  capabilities, tech stack, architecture, and any new features. Keep the
  same visual design language and existing branding. Update `i18n.js` for
  all locales when user-facing copy changes.

   ## Step 4: Commit and create PR
   If material corrections are needed, commit them to a unique branch named
   `docs/nightly-website-update-{YYYY-MM-DD-HHMM}` using UTC time, push, and
   create a GitHub PR against `main` with a summary of what was updated and
   why using the `chetter_create_pr` MCP tool.

    Call `chetter_create_pr` with `task_id=$CHETTER_TASK_ID`, `repo="$GITHUB_REPO"`, `head=<branch-name>`, and `base="main"`. Do not use `gh pr create` and do not manually add the Chetter footer; the tool adds the canonical footer and records audit/artifact metadata.

  Do NOT push directly to main. Keep changes focused on website accuracy
  only. If no material correction is needed, leave files unchanged and exit
  without a PR.
