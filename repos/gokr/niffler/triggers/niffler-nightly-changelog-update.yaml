# yaml-language-server: $schema=../../../../../chetter/schemas/trigger.schema.json
# Trigger: Niffler nightly changelog update
#
# Reviews the last 24 hours of commit history and maintains the root
# CHANGELOG.md (Keep a Changelog format), opening a PR when entries are
# needed.

name: niffler-nightly-changelog-update
enabled: true
cron_expr: "10 0 * * *"
git_url: https://github.com/gokr/niffler
git_ref: main
agent_image: ghcr.io/flatout-works/chetter-agent:nim
harness: claude-code
agent: changelog-maintainer
provider_id: synthetic
model_id: hf:zai-org/GLM-5.3-Flash
timeout_sec: 3600
# Resumable (gVisor): a stuck or failed attempt keeps its container, so the
# session can be resumed with the workspace intact within ttl_hours.
session_mode: resumable
ttl_hours: 24
prompt: |-
  Maintain the repository's root `CHANGELOG.md` from recent changes.

  GITHUB_REPO=gokr/niffler

  Review the last 24 hours of commit history:

      git log --since="24 hours ago" --no-merges --pretty=format:"%h %ad %s" --date=iso

  Inspect the actual changes, not only commit subjects. Use `git show --stat`,
  `git show --name-only`, and targeted diffs as needed.

  Update `CHANGELOG.md` only when there are user-visible, developer-facing,
  operational, or documentation changes worth recording. Use factual entries
  under the `[Unreleased]` heading, following the existing Keep a Changelog
  style with Added/Changed/Fixed categories; do not invent capabilities or
  add marketing copy. Skip purely mechanical churn unless it affects users,
  operators, contributors, or release notes.

   If `CHANGELOG.md` is created or modified, create a branch named
   `docs/update-changelog-YYYY-MM-DD-HHMM` using UTC time, commit with message
   `docs: update changelog from recent history`, push, and open a pull request
   against `main` using the `chetter_create_pr` MCP tool.

    Call `chetter_create_pr` with `task_id=$CHETTER_TASK_ID`, `repo="$GITHUB_REPO"`, `head=<branch-name>`, and `base="main"`. Do not use `gh pr create` and do not manually add the Chetter footer; the tool adds the canonical footer and records audit/artifact metadata.

   If there are no changelog-worthy changes, leave files unchanged and report
   that no update was needed. Do not push directly to `main`.
