# yaml-language-server: $schema=../../../../../chetter/schemas/trigger.schema.json
# Trigger: Niffler issue implementation
#
# When a human adds the approved label to a triaged issue, an agent reads
# the issue, implements the solution, and opens a PR against main.

name: niffler-issue-implementer
enabled: true
trigger_type: issue
repo: gokr/niffler
event: labeled
match_labels:
  - approved
agent_image: ghcr.io/flatout-works/chetter-agent:nim
harness: opencode
agent: issue-implementer
# No provider_id/model_id pin: use the model catalog default for the opencode
# harness. Pins that are only wired for another harness have caused repeated
# "stuck harness: no progress" task failures elsewhere.
git_url: https://github.com/gokr/niffler
git_ref: main
timeout_sec: 14400
# Resumable (gVisor): a stuck or failed attempt keeps its container, so the
# session can be resumed with the workspace intact within ttl_hours.
session_mode: resumable
ttl_hours: 24
prompt: |-
  You are implementing a solution for a GitHub issue in the Niffler repository
  that has been approved by a human after triage. You have access to the
  repository and the `gh` CLI.

  ## Context

  Environment variables available to you:
  - ISSUE_NUMBER — the issue number
  - ISSUE_TITLE — the issue title
  - ISSUE_URL — the issue URL
  - ISSUE_BODY — the issue body
  - GITHUB_REPO — repository (e.g., my-org/my-repo)

  Git and allowed read-only `gh` commands receive short-lived,
  repository-scoped credentials from Chetter automatically. GitHub writes must
  use the audited Chetter MCP tools.

  ## Procedure

  ### 1. Understand the issue

  Read the issue description, triage assessment, and all comments:

  ```bash
  gh issue view $ISSUE_NUMBER --comments --json title,body,comments,labels
  ```

  Pay special attention to the triage comment — it contains the
  assessment, category, priority, and an implementation plan.

  ### 2. Plan the implementation

  Review the triage plan and inspect the relevant parts of the codebase.
  Identify which files, components, or modules need changes. Adjust the
  plan if you find issues the triage missed. Read `AGENTS.md` and follow it:
  camelCase, `fmt("...")` as a proc call, no asyncdispatch, `##` doc
  comments; core never imports component code and components never import
  core.

  ### 3. Implement

  Make minimal, focused changes. Follow existing code conventions and
  project structure. Add or update tests under `tests/`. Run verification:

  ```bash
  make build
  make test-<component>   # the narrowest relevant test target
  ```

  Run the full `make test` only when the change broadly touches the bus or
  SDK. If tests fail, fix them. Do not commit broken code.

   ### 4. Create a PR

   Create a branch named `fix/issue-ISSUE_NUMBER-short-description`,
   commit with a descriptive message referencing the issue, push, and
   open a pull request against `main` using the `chetter_create_pr` MCP tool.

   Call `chetter_create_pr` with `task_id=$CHETTER_TASK_ID`, `repo=$GITHUB_REPO`,
   `head=<branch-name>`, and `base="main"`. Do not use `gh pr create` and do not
   manually add the Chetter footer; the tool adds the canonical footer and records
   audit/artifact metadata.

   The PR description must include:
   - **Closes**: `#ISSUE_NUMBER`
   - **Summary**: what was changed and why
   - **Checklist**: any verification steps you ran (make build, make test-*, etc.)

  If the issue is already completed or a PR already exists, report that and exit without creating a new PR.
