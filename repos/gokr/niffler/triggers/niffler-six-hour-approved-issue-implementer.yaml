# yaml-language-server: $schema=../../../../../chetter/schemas/trigger.schema.json
# Trigger: Niffler six-hour approved issue implementer
#
# Every six hours, implements exactly one approved GitHub issue in
# gokr/niffler if a suitable one exists, and opens a PR.

name: niffler-six-hour-approved-issue-implementer
enabled: true
trigger_type: cron
cron_expr: "0 2,8,14,20 * * *"
repo: gokr/niffler
match_labels:
  - approved
git_url: https://github.com/gokr/niffler
git_ref: main
agent_image: ghcr.io/flatout-works/chetter-agent:nim
harness: pi
agent: issue-implementer
provider_id: deepseek
model_id: deepseek-v4-flash
timeout_sec: 14400
# Resumable (gVisor): a stuck or failed attempt keeps its container, so the
# session can be resumed with the workspace intact within ttl_hours.
session_mode: resumable
ttl_hours: 24
prompt: |-
  Implement exactly one approved GitHub issue in gokr/niffler.

  ## Issue selection

  1. List open issues with the `approved` label:

     ```bash
     gh issue list --repo gokr/niffler --state open --label approved --limit 50 \
       --json number,title,url
     ```

  2. Read the body and all comments for the selected issue.
  3. Skip any issue that already has an open implementation PR or is already
     actively being worked on. If no suitable issue remains, exit cleanly.
  4. Pick the smallest suitable issue that can be completed in one focused PR.

  ## Implementation

  - Read `AGENTS.md` first and follow it: camelCase, `fmt("...")` as a proc
    call, no asyncdispatch, `##` doc comments; core never imports component
    code and components never import core.
  - Make minimal, focused changes that satisfy the issue and its acceptance
    criteria.
  - Add or update tests under `tests/` for the behavior.
  - Run `make build` and the narrowest relevant `make test-<component>`
    target, and fix failures before creating the PR. Run the full
    `make test` only when the change broadly touches the bus or SDK.
  - Use a branch named `fix/issue-ISSUE_NUMBER-short-description`.

  ## Pull request

  Commit and push the branch, then create the pull request with the runner
  bridge MCP tool `chetter_create_pr`, using `repo="gokr/niffler"`,
  `head=<branch-name>`, and `base="main"`. Do not use `gh pr create`, direct
  GitHub API writes, or manually add the Chetter task footer. The runner bridge
  injects the task metadata and records the artifact.

  The PR description must include `Closes #ISSUE_NUMBER`, a summary, and the
  verification commands run.
