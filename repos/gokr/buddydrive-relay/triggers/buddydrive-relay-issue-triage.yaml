# yaml-language-server: $schema=../../../../../chetter/schemas/trigger.schema.json
name: buddydrive-relay-issue-triage
enabled: true
trigger_type: issue
repo: gokr/buddydrive-relay
event: opened
agent_image: ghcr.io/flatout-works/chetter-agent:minimal
harness: claude-code
agent: issue-triage
provider_id: synthetic
model_id: hf:zai-org/GLM-5.3-Flash
timeout_sec: 3600
prompt: |-
  Triage the newly opened issue in $GITHUB_REPO.

  Read it with:

  ```bash
  gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPO" --json title,body,labels,assignees,comments
  ```

  Classify the issue, assess priority, and produce a concrete plan. Post a
  structured comment using `chetter_issue_comment`. If the issue is clear and
  actionable, include `Suggested label: ready-for-approval` in the comment so
  a human can apply it. Direct `gh` issue edits are intentionally blocked.

  Never add `approved`; that label requires human approval.
