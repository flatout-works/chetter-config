# yaml-language-server: $schema=../../../../../chetter/schemas/trigger.schema.json
name: chetter-nightly-website-presentation-update
enabled: true
cron_expr: "0 5 * * *"
git_url: https://github.com/flatout-works/chetter
git_ref: main
agent_image: ghcr.io/flatout-works/chetter-agent:golang
harness: claude-code
agent: docs-maintainer
provider_id: synthetic
model_id: syn:large:text
timeout_sec: 7200
# Resumable (gVisor): a stuck or failed attempt keeps its container, so the
# session can be resumed with the workspace intact within ttl_hours.
session_mode: resumable
ttl_hours: 24
prompt: |-
  Update the website and technical architecture pages to reflect changes merged in the last 24 hours. Work from a bounded diff, not a repository survey.

  GITHUB_REPO=flatout-works/chetter

  ## Step 0: Reuse an existing nightly website PR

  Run once:
  ```bash
  gh pr list --state open --limit 30 --json number,headRefName,url \
    --jq '.[] | select(.headRefName | startswith("docs/nightly-website-update-"))'
  ```

  - No match: continue with a fresh branch in Step 4.
  - One or more matches: reuse the newest branch (highest `YYYY-MM-DD-HHMM` timestamp). Fetch and check it out, then add only what is still missing. Never open a second nightly website PR; mention any older branches as stale in the final report.

  ## Step 1: Identify the change window

  Run once:
  ```bash
  git log --since="24 hours ago" --no-merges --pretty=format:"%h %s" --all
  ```

  If no product or behavior commit is in that window, do not invent work: go to Step 5 and exit without changes.

  ## Step 2: Read current materials (fixed list, no tree sweep)

  Read only these files:
  - `website/current/index.html` — deployed marketing page
  - `website/old/technical.html` — technical architecture page
  - `website/old/marketing.css` — shared styles, only if a style change is required
  - `README.md`, `AGENTS.md`, `CHANGELOG.md` — source-of-truth claims

  If a path does not exist, locate the replacement with a single `find website -name '*.html'` and proceed. Do not explore other directories, read source files, or grep the codebase to justify copy.

  ## Step 3: Update the pages

  Make minimal factual corrections so the pages match shipped behavior. Keep existing structure, branding, and visual language. Do not restyle, rewrite for marketing, or describe planned work as shipped.

  ## Step 4: Commit and open or update the PR

  Commit only the website files you changed to `docs/nightly-website-update-{YYYY-MM-DD-HHMM}` (UTC). Push it. If no open nightly website PR was reused, call `chetter_create_pr` with `task_id=$CHETTER_TASK_ID`, `repo="$GITHUB_REPO"`, `head=<branch-name>`, and `base="main"`. Do not use `gh pr create` and do not add a manual Chetter footer. Never push directly to main.

  ## Step 5: Stopping rules

  Terminal states — exactly one applies:
  1. Existing nightly website PR updated (no new PR).
  2. One new PR created.
  3. No material correction needed; files unchanged, no PR.

  At a terminal state, print the PR URL or the no-change reason as the final message and stop. Do not re-verify the PR, poll checks, re-read files, or investigate related source. Call `chetter_create_pr` at most once. A continuation prompt after a terminal state gets a one-line final status, not another investigation.
