# yaml-language-server: $schema=../chetter/schemas/model-catalog.schema.json
version: 1
default_provider: synthetic
default_model: syn:large:text

defaults:
  opencode:
    provider: synthetic
    model: syn:large:text
  pi:
    provider: deepseek
    model: deepseek-v4-flash
  claude-code:
    provider: synthetic
    model: syn:large:text
  codewhale:
    provider: deepseek
    model: deepseek-v4-flash
  codex:
    provider: deepseek
    model: deepseek-v4-flash

providers:
  synthetic:
    name: Synthetic
    kind: openai_compatible
    base_url: https://api.synthetic.new/openai/v1
    api_key_env: SYNTHETIC_API_KEY
    # Stable Synthetic aliases: syn:large:text always resolves to whichever
    # model Synthetic currently serves as its large text model, so this catalog
    # entry does not need to change when model ids churn. The old
    # hf:zai-org/GLM-5.2 pin is no longer served by Synthetic at all.
    # https://dev.synthetic.new/docs/api/models
    models:
      - id: syn:large:text
        name: Synthetic (current large text model)
      - id: hf:zai-org/GLM-5.3-Flash
      - id: hf:zai-org/GLM-4.7-Flash
      - id: hf:Qwen/Qwen3.6-27B
      - id: hf:Qwen/Qwen3.8-27B
      - id: hf:openai/gpt-oss-120b
      - id: hf:nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
    harnesses:
      pi:
        api: openai-completions
        auth_header: true
      claude-code:
        base_url: https://api.synthetic.new/anthropic
        api: anthropic-messages
      # Synthetic has no /responses endpoint; route Codex through chat
      # completions instead of its default responses wire API.
      codex:
        api: openai-completions

  opencode:
    name: OpenCode Zen
    kind: openai_compatible
    api_key_env: OPENCODE_API_KEY
    base_url: https://opencode.ai/zen/v1
    models:
      - id: deepseek-v4-flash-free

  deepseek:
    name: DeepSeek
    kind: openai_compatible
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    models:
      - id: deepseek-v4-pro
      - id: deepseek-v4-flash
